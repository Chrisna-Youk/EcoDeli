services:
  ecodeli:
    build: .
    container_name: ecodeli-be
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - backend-volume:/app/backend/uploads
    networks:
      - backend-network
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mysql:8.0
    container_name: ecodeli-db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - database-volume:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 20s
    restart: always

networks:
  backend-network:
    driver: bridge

volumes:
  backend-volume:
  database-volume:
