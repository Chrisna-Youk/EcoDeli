services:
  ecodeli-frontend:
    image: ecodeli-frontend-dev-i
    container_name: ecodeli-frontend-dev-c
    build:
      context: .
      target: frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ecodeli-frontend-dev-v:/app/frontend/node_modules
    depends_on:
      ecodeli-database:
        condition: service_healthy
  ecodeli-backend:
    image: ecodeli-backend-dev-i
    container_name: ecodeli-backend-dev-c
    build:
      context: .
      target: backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - ecodeli-backend-dev-v:/app/backend/node_modules
    depends_on:
      ecodeli-database:
        condition: service_healthy
  ecodeli-database:
    image: mysql:8.0
    container_name: ecodeli-database-dev-c
    env_file:
      - .env
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 20s
    ports:
      - "3306:3306"
    volumes:
      - ecodeli-database-dev-v:/var/lib/mysql

volumes:
  ecodeli-frontend-dev-v:
  ecodeli-backend-dev-v:
  ecodeli-database-dev-v:
